[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tff-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for tff.org (Turkish Football Federation): standings, fixtures, match details, scorers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
tff-mcp = "tff_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tff_mcp"]
